name: Release

run-name: Release pullwise-worker ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Worker version, for example 0.10.25"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          case "$version" in
            ""|*[!0-9.]*|.*|*.|*..*) echo "Invalid version: $version"; exit 1 ;;
          esac
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Pack the Node Worker
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: pullwise-worker-node
          path: pullwise-worker-*.tgz
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" pullwise-worker-*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" pullwise-worker-*.tgz --target "$GITHUB_SHA" --generate-notes
          fi
